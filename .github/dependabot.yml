version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    labels:
      - dependencies
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /webui
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    labels:
      - dependencies
    groups:
      webui-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /vscode-withnav
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    labels:
      - dependencies
    # Both type packages describe the runtime the extension runs in, not a library to keep
    # current: @types/vscode must not be newer than engines.vscode (vsce refuses to package
    # otherwise, seen 2026-10-12), and @types/node must match the Node of that VS Code, so a
    # newer major would type-check APIs the editor does not have. Bump them by hand with
    # engines.vscode.
    ignore:
      - dependency-name: "@types/vscode"
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      extension-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    labels:
      - dependencies
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch
