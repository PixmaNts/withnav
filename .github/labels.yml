# Source of truth for the repository labels. The labels-sync workflow
# creates or updates each entry below; labels not listed here are left alone.
labels:
  # GitHub defaults
  - name: accessibility
    color: "f143ab"
    description: Barrier affecting people with disabilities
  - name: bug
    color: "d73a4a"
    description: Something isn't working
  - name: documentation
    color: "0075ca"
    description: Improvements or additions to documentation
  - name: duplicate
    color: "cfd3d7"
    description: This issue or pull request already exists
  - name: enhancement
    color: "a2eeef"
    description: New feature or request
  - name: good first issue
    color: "7057ff"
    description: Good for newcomers
  - name: help wanted
    color: "008672"
    description: Extra attention is needed
  - name: invalid
    color: "e4e669"
    description: This doesn't seem right
  - name: question
    color: "d876e3"
    description: Further information is requested
  - name: wontfix
    color: "ffffff"
    description: This will not be worked on

  # Dependabot
  - name: dependencies
    color: "0366d6"
    description: Pull requests that update a dependency file

  # Triage and process
  - name: needs-triage
    color: "fbca04"
    description: New issue, waiting for maintainer triage
  - name: needs-info
    color: "d876e3"
    description: Waiting on the reporter for more information
  - name: stale
    color: "e4e669"
    description: No activity for a while; the stale bot will close it
  - name: security
    color: "d73a4a"
    description: Security-related (handled privately)
  - name: ci
    color: "0e8a16"
    description: CI / build / tooling

  # Areas, applied to pull requests by path
  - name: "area: core"
    color: "1d76db"
    description: "Rust core: nav, withnav-lsp, crates/"
  - name: "area: webui"
    color: "a371f7"
    description: WebUI (InstinctFlow Studio)
  - name: "area: extension"
    color: "0cf574"
    description: VS Code extension (vscode-withnav/)
