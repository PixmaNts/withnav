name: PR labeler

# Runs on pull_request, not pull_request_target: the labeler only reads the
# list of changed paths and never checks out or runs pull request code, so a
# privileged token on untrusted code would bring nothing.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: true
