# Pushing a tag vX.Y.Z builds Linux/Windows binaries and VS Code packages and publishes them
# as a GitHub Release. A manual run, or a pull request touching the packaging, builds the same
# files as workflow artifacts and never publishes, so the pipeline is checked before a release.
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
  # A change to the packaging itself is built (never published) before it can reach a tag.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/package-vsix.sh
      - vscode-withnav/**

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify versions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: check
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          ext_version="$(jq -r .version vscode-withnav/package.json)"
          if [ "$cargo_version" != "$ext_version" ]; then
            echo "Cargo.toml ($cargo_version) and vscode-withnav/package.json ($ext_version) disagree" >&2
            exit 1
          fi
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$cargo_version" ]; then
            echo "tag $REF_NAME does not match version $cargo_version" >&2
            exit 1
          fi
          echo "version=$cargo_version" >> "$GITHUB_OUTPUT"

  # One job per architecture: the static binary, its tarball and the platform VSIX that embeds it.
  binary:
    name: nav ${{ matrix.vsix }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - vsix: linux-x64
            target: x86_64-unknown-linux-musl
          - vsix: linux-arm64
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-withnav/package-lock.json
      - name: Add the musl target
        run: rustup target add "$TARGET"
        env:
          TARGET: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      # zig is the C cross-compiler for aws-lc-rs, SQLite and Oniguruma. 0.23 or later is needed: older
      # cargo-zigbuild passes an arm64 linker flag that zig rejects.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-zigbuild@0.23.4
      - name: Build the binary and the platform VSIX
        run: scripts/package-vsix.sh "$VSIX"
        env:
          VSIX: ${{ matrix.vsix }}
      - name: Tar the binary
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          dir="nav-$VERSION-$TARGET"
          mkdir -p "dist/$dir"
          cp "target/$TARGET/release/nav" LICENSE-MIT LICENSE-APACHE "dist/$dir/"
          tar -C dist -czf "dist/$dir.tar.gz" "$dir"
          rm -rf "dist/$dir"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.vsix }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: nav win32-x64
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-withnav/package-lock.json
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: x86_64-pc-windows-msvc
      - name: Build the native MSVC binary
        run: cargo build --release --locked --bin nav --target x86_64-pc-windows-msvc
      - name: Package the platform VSIX
        shell: bash
        env:
          NAV_BINARY: target/x86_64-pc-windows-msvc/release/nav.exe
        run: scripts/package-vsix.sh win32-x64
      - name: Zip the binary and licenses
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          $dir = "nav-$env:VERSION-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Path "dist/$dir" | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/nav.exe, LICENSE-MIT, LICENSE-APACHE "dist/$dir/"
          Compress-Archive -Path "dist/$dir" -DestinationPath "dist/$dir.zip"
          Remove-Item -Recurse "dist/$dir"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-win32-x64
          path: dist/*
          if-no-files-found: error

  # No binary inside: the extension then uses `nav` from PATH or withnav.serverPath.
  universal:
    name: universal VSIX
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vscode-withnav/package-lock.json
      - run: scripts/package-vsix.sh universal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-universal
          path: dist/*
          if-no-files-found: error

  checksums:
    name: validate release checksums
    needs: [binary, windows, universal]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum -- *.vsix *.tar.gz *.zip > SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validation-checksums
          path: assets/SHA256SUMS
          if-no-files-found: error

  publish:
    name: publish release
    needs: [verify, binary, windows, universal, checksums]
    # Only a pushed tag publishes. A manual run, even one started on a tag, stops after the build
    # jobs: its artifacts are the result.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: assets
          merge-multiple: true
      - name: Checksums
        working-directory: assets
        run: sha256sum -- *.vsix *.tar.gz *.zip > SHA256SUMS
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $VERSION" >&2
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          ls -l assets
          gh release create "$TAG" assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "WithNav $VERSION" \
            --notes-file notes.md
