name: Stale issues

# Issues only: closing a contributor's pull request for inactivity costs
# more goodwill than it saves. Pull requests are never touched.
on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          days-before-pr-stale: -1
          days-before-pr-close: -1
          remove-stale-when-updated: true
          stale-issue-label: stale
          exempt-issue-labels: "good first issue,help wanted,security,needs-triage"
          stale-issue-message: >
            This issue has had no activity for 60 days, so it is marked as stale.
            It will be closed in 14 days unless there is new activity.
            A comment is enough to keep it open.
          close-issue-message: >
            Closing this issue after 14 days without activity. Thanks for the report!
            If it still matters, comment or open a new issue and we will take another look.
