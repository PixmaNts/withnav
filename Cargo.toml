[workspace]
members = ["crates/*"]
resolver = "2"

# Versions used by more than one crate. Members add their own `features`; the base entry carries
# only what every user needs.
[workspace.dependencies]
tokio = "1.53"
tokio-util = "0.7"
# rustls, NOT native-tls, for reproducible builds (no system OpenSSL). reqwest 0.13 names it
# `rustls` (aws-lc-rs crypto); `query` gates `RequestBuilder::query`.
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.8"
thiserror = "2.0.20"
ulid = { version = "3", features = ["std", "serde"] }
time = "0.3"
sha2 = "0.11"
hex = "0.4"
futures-util = "0.3"
clap = { version = "4.6.6", features = ["derive"] }
evalexpr = "13.1.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
sse-stream = { version = "0.3", default-features = true }
tracing = "0.1"

[package]
name = "withnav"
version = "0.8.1"
edition = "2024"
rust-version = "1.89"
homepage = "https://withnav.dev"
repository = "https://github.com/PixmaNts/withnav"
description = "WithNav: a pair-programming assistant around a coding-agent core (reflex, instinct, metacognition, cognition)"
license = "MIT OR Apache-2.0"

# LIB + BIN split: all behavior lives in the library; the binary is a thin CLI shell.
[lib]
name = "withnav"
path = "src/lib.rs"

[[bin]]
name = "nav"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-child-process"] }
instinct-flow = { path = "crates/instinct-flow" }
withnav-client-api = { path = "crates/withnav-client-api" }
withnav-client = { path = "crates/withnav-client" }
withnav-client-state = { path = "crates/withnav-client-state" }
withnav-tui = { path = "crates/withnav-tui" }
withnav-provider = { path = "crates/withnav-provider" }
tokio = { workspace = true, features = [
    "rt-multi-thread",
    "macros",
    "process",
    "signal",
    "fs",
    "io-util",
    "io-std",
    "time",
    "sync",
] }
reqwest = { workspace = true, features = ["rustls", "query", "json", "stream", "gzip", "deflate", "brotli"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
anyhow = "1.0.104"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio-util = { workspace = true, features = ["rt"] }
ulid.workspace = true
clap.workspace = true
sha2.workspace = true
# sha2 0.11 digests no longer implement LowerHex: hex-encode them explicitly.
hex.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
directories = "6.0.0"
tempfile = "3"
regex = "1"
bytes = "1"
futures-util.workspace = true
# Phase 2: event bus + local HTTP server (thin slice wrapping the Phase-1 loop).
axum = { version = "0.8.9", features = ["macros"] }
futures = "0.3"
tower-lsp-server = "0.23.0"
similar = "3.2.0"
# Navigator pipeline branch conditions: builtin functions disabled at use sites.
evalexpr.workspace = true
# Conversation history (navigator): one SQLite file per user, bundled SQLite.
rusqlite = { version = "0.40", features = ["bundled"] }
serde-saphyr = "2.0.0"
globset = "0.4.20"
ignore = "0.4"
htmd = "0.5"
html2text = "0.17"
encoding_rs = "0.8.42"
include_dir = "0.7"
# Image type and dimensions from the header alone, for uploaded attachments (never decodes pixels).
imagesize = "0.15"

[dev-dependencies]
withnav-provider = { path = "crates/withnav-provider", features = ["test-support"] }
# The terminal client tests that start a real server drive its runtime with key events.
ratatui.workspace = true
crossterm.workspace = true
tokio = { workspace = true, features = ["test-util"] }
proptest = "1"
wiremock = "0.6"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
insta = "1.48"
flate2 = "1.1.10"

[profile.release]
lto = "thin"

# Live probes against the configured models: tooling run by hand, never by CI. They live in
# tools/ rather than examples/ because they check a setup, they do not show how to use the crate.
[[example]]
name = "instinct_probe"
path = "tools/instinct_probe.rs"

[[example]]
name = "reflex_latency_probe"
path = "tools/reflex_latency_probe.rs"

# Unix-only primitives (signals, process groups, descriptor-relative file access, flock).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal", "fs", "resource", "user", "dir"] }

# Windows backends: file ACLs for private files, Job Objects for owned process trees,
# ShellExecuteW to open the browser, the registry to locate Git for Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
