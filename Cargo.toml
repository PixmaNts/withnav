[workspace]
members = ["crates/instinct-flow"]
resolver = "2"

[package]
name = "withnav"
version = "0.7.8"
edition = "2021"
rust-version = "1.89"
homepage = "https://withnav.dev"
repository = "https://github.com/PixmaNts/withnav"
description = "WithNav: a pair-programming assistant around a coding-agent core (reflex, instinct, metacognition, cognition)"
license = "MIT OR Apache-2.0"

# LIB + BIN split: all behavior lives in the library; the binary is a thin CLI shell.
[lib]
name = "withnav"
path = "src/lib.rs"

[[bin]]
name = "nav"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.5", default-features = false, features = ["client", "transport-child-process"] }
instinct-flow = { path = "crates/instinct-flow" }
tokio = { version = "1.53", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "signal",
    "fs",
    "io-util",
    "io-std",
    "time",
    "sync",
] }
# rustls, NOT native-tls, for reproducible builds (no system OpenSSL). reqwest 0.13 names it
# `rustls` (aws-lc-rs crypto); `query` gates `RequestBuilder::query`.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "query", "json", "stream", "gzip", "deflate", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1.8"
thiserror = "2.0.20"
anyhow = "1.0.104"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio-util = { version = "0.7", features = ["rt"] }
ulid = { version = "3.0.0", features = ["std", "serde"] }
clap = { version = "4.6.6", features = ["derive"] }
sha2 = "0.11.0"
# sha2 0.11 digests no longer implement LowerHex: hex-encode them explicitly.
hex = "0.4"
time = { version = "0.3", features = ["formatting", "parsing"] }
directories = "6.0.0"
tempfile = "3"
regex = "1"
bytes = "1"
futures-util = "0.3"
# Phase 2: event bus + local HTTP server (thin slice wrapping the Phase-1 loop).
axum = { version = "0.8.9", features = ["macros"] }
futures = "0.3"
tower-lsp-server = "0.23.0"
similar = "3.2.0"
# Navigator pipeline branch conditions: builtin functions disabled at use sites.
evalexpr = "13.1.0"
# Conversation history (navigator): one SQLite file per user, bundled SQLite.
rusqlite = { version = "0.40", features = ["bundled"] }
# Terminal client (`nav tui`): an HTTP + SSE client of the session server.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui-textarea = "0.9.2"
tui-markdown = { version = "0.3.10", features = ["highlight-code"] }
eventsource-stream = "0.2.3"
serde-saphyr = "1.3"
globset = "0.4.20"
ignore = "0.4"
htmd = "0.5.5"
html2text = "0.17.1"
encoding_rs = "0.8.42"
unicode-segmentation = "1"
include_dir = "0.7"

[dev-dependencies]
tokio = { version = "1.53", features = ["test-util"] }
proptest = "1"
wiremock = "0.6"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
insta = "1.48"
flate2 = "1.1.10"

[profile.release]
lto = "thin"

# Live probes against the configured models: tooling run by hand, never by CI. They live in
# tools/ rather than examples/ because they check a setup, they do not show how to use the crate.
[[example]]
name = "instinct_probe"
path = "tools/instinct_probe.rs"

[[example]]
name = "reflex_latency_probe"
path = "tools/reflex_latency_probe.rs"

# Unix-only primitives (signals, process groups, descriptor-relative file access, flock).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal", "fs", "resource", "user", "dir"] }

# Windows backends: file ACLs for private files, Job Objects for owned process trees,
# ShellExecuteW to open the browser, the registry to locate Git for Windows.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
