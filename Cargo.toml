[package]
name = "navai"
version = "0.4.2"
edition = "2021"
rust-version = "1.89"
description = "Navigator: a pair-programming assistant around a coding-agent core (reflex, instinct, metacognition, cognition)"
license = "MIT OR Apache-2.0"

# LIB + BIN split: all behavior lives in the library; the binary is a thin CLI shell.
[lib]
name = "navai"
path = "src/lib.rs"

[[bin]]
name = "navai"
path = "src/main.rs"

[[bin]]
name = "navai-lsp"
path = "src/bin/navai-lsp.rs"

[dependencies]
tokio = { version = "1.53", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "signal",
    "fs",
    "io-util",
    "io-std",
    "time",
    "sync",
] }
# rustls, NOT native-tls, for reproducible builds (no system OpenSSL).
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "deflate", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2.0.20"
anyhow = "1.0.104"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio-util = { version = "0.7", features = ["rt"] }
ulid = { version = "1", features = ["std", "serde"] }
clap = { version = "4.6.6", features = ["derive"] }
nix = { version = "0.31.3", features = ["signal", "fs", "resource"] }
directories = "6.0.0"
tempfile = "3"
regex = "1"
bytes = "1"
futures-util = "0.3"
# Phase 2: event bus + local HTTP server (thin slice wrapping the Phase-1 loop).
axum = { version = "0.8.9", features = ["macros"] }
futures = "0.3"
tower-lsp-server = "0.23.0"
similar = "3.2.0"
# Navigator pipeline branch conditions: builtin functions disabled at use sites.
evalexpr = "13.1.0"
# Conversation history (navigator): one SQLite file per user, bundled SQLite.
rusqlite = { version = "0.40", features = ["bundled"] }
# Terminal client (`navai tui`): an HTTP + SSE client of the session server.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
crossterm = { version = "0.29", features = ["event-stream"] }
ratatui-textarea = "0.9.2"
tui-markdown = { version = "0.3.10", features = ["highlight-code"] }
eventsource-stream = "0.2.3"
serde-saphyr = "1.3"
globset = "0.4.20"
htmd = "0.5.5"
html2text = "0.17.1"
encoding_rs = "0.8.42"
unicode-segmentation = "1"

[dev-dependencies]
tokio = { version = "1.53", features = ["test-util"] }
proptest = "1"
wiremock = "0.6"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
insta = "1.48"
flate2 = "1.1.10"

[profile.release]
lto = "thin"
