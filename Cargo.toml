[package]
name = "rust-agent"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A personal, minimal-but-complete coding agent in Rust (Phase 1 vertical slice)"
license = "MIT OR Apache-2.0"

# LIB + BIN split: all behavior lives in the library; the binary is a thin CLI shell.
[lib]
name = "rust_agent"
path = "src/lib.rs"

[[bin]]
name = "rust-agent"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.53", features = [
    "rt-multi-thread",
    "macros",
    "process",
    "signal",
    "fs",
    "io-util",
    "time",
    "sync",
] }
# rustls, NOT native-tls, for reproducible builds (no system OpenSSL).
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2.0.20"
anyhow = "1.0.104"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio-util = { version = "0.7", features = ["rt"] }
ulid = { version = "1", features = ["std"] }
clap = { version = "4.6.6", features = ["derive"] }
nix = { version = "0.31.3", features = ["signal"] }
directories = "6.0.0"
tempfile = "3"
regex = "1"
bytes = "1"
futures-util = "0.3"
# Phase 2: event bus + local HTTP server (thin slice wrapping the Phase-1 loop).
axum = { version = "0.8.9", features = ["ws", "macros"] }
futures = "0.3"

[dev-dependencies]
proptest = "1"
wiremock = "0.6"
tokio-tungstenite = "0.24"

[profile.release]
lto = "thin"
