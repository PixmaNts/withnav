[package]
name = "instinct-flow"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Host-independent bounded decision graph engine"

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
evalexpr = "13.1.0"
thiserror = "2.0.20"
ulid = { version = "1", features = ["std", "serde"] }
url = "2"
futures-util = "0.3"
clap = { version = "4.6.6", features = ["derive"] }

[dev-dependencies]
tokio = { version = "1.53", features = ["test-util"] }
wiremock = "0.6"
