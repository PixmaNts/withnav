[package]
name = "instinct-flow"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Host-independent bounded decision graph engine"

[dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
tokio-util = { workspace = true, features = ["rt"] }
reqwest = { workspace = true, features = ["json", "stream", "rustls"] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
evalexpr.workspace = true
thiserror.workspace = true
ulid.workspace = true
url = "2"
sha2.workspace = true
hex.workspace = true
futures-util.workspace = true
clap.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
wiremock = "0.6"
