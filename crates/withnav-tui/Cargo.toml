[package]
name = "withnav-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
description = "Terminal client of the WithNav session server: input, editor, views, themes, settings screen"

# Never the server: it talks to it through withnav-client and reaches the host (settings files,
# git, home folder) through the `TuiHost` trait its caller passes in.
[dependencies]
withnav-client-api = { path = "../withnav-client-api" }
withnav-client = { path = "../withnav-client" }
withnav-client-state = { path = "../withnav-client-state" }
tokio = { workspace = true, features = ["rt", "macros", "signal", "sync", "time"] }
tokio-util.workspace = true
futures-util.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
ratatui.workspace = true
crossterm = { workspace = true, features = ["event-stream"] }
ratatui-textarea = "0.9.2"
tui-markdown = { version = "0.3.10", features = ["highlight-code"] }
unicode-segmentation = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "rt-multi-thread", "net"] }
serde.workspace = true
ulid.workspace = true
tempfile = "3"
axum = "0.8.9"
wiremock = "0.6"
insta = "1.48"
