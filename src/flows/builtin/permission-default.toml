[flow]
version = 1
name = "permission-default"
on = "tool.pre_call"
enabled = true
blocking = true
budget_ms = 2000
start = ["protected"]

[constants]
PROTECTED_MIN = 0.9
REQUESTED_MIN = 0.6
READ_ONLY_MIN = 0.6
RECOVERABLE_MIN = 0.7
DANGER_MIN = 0.5

[fallback]
on_failure = { action = "apply_rule", params = {} }

[[node]]
id = "protected"
type = "expression"
condition = "is_set(protected) && protected && !(is_set(protected_checked) && protected_checked)"
[node.inputs]
protected = "event.protected"
protected_checked = "event.protected_checked"
[node.next]
true = ["protected_requested"]
false = ["rule_effect"]

[[node]]
id = "protected_requested"
type = "noul"
instructions = "Did the Captain explicitly ask to change WithNav's configuration, permission rules or database in this way, or explicitly accept an agent proposal to do it?"
threshold = "constant.PROTECTED_MIN"
state_template = "protected-state.md"
[node.inputs]
captain_messages = "conversation.captain_messages"
recent = "conversation.recent"
tool = "event.tool"
args = "event.args"
[node.next]
yes = ["protected_allow"]
no = ["protected_ask"]

[[node]]
id = "rule_effect"
type = "expression"
condition = 'is_set(effect) && effect == "allow"'
[node.inputs]
effect = "event.rule_effect"
[node.next]
true = ["danger"]
false = ["requested"]

[[node]]
id = "requested"
type = "noul"
instructions = "Did the Captain ask for this action, or explicitly accept an agent proposal to do it? A request from the parent agent through its delegation, or from the validated skill active this turn, counts too."
threshold = "constant.REQUESTED_MIN"
state_template = "state.md"
[node.inputs]
captain_messages = "conversation.captain_messages"
recent = "conversation.recent"
delegation = "conversation.delegation"
skill = "event.skill"
tool = "event.tool"
args = "event.args"
commands = "event.commands"
inside_project = "event.inside_project"
rule = "event.rule"
[node.next]
yes = ["allow"]
no = ["unrequested"]

[[node]]
id = "unrequested"
type = "expression"
condition = 'is_set(effect) && effect == "allow"'
[node.inputs]
effect = "event.rule_effect"
[node.next]
true = ["danger_ask"]
false = ["read_only"]

[[node]]
id = "read_only"
type = "noul"
instructions = "Does this call only read or list things, without changing any file, process or remote state?"
threshold = "constant.READ_ONLY_MIN"
state_template = "state.md"
[node.inputs]
captain_messages = "conversation.captain_messages"
recent = "conversation.recent"
delegation = "conversation.delegation"
skill = "event.skill"
tool = "event.tool"
args = "event.args"
commands = "event.commands"
inside_project = "event.inside_project"
rule = "event.rule"
[node.next]
yes = ["allow"]
no = ["recoverable"]

[[node]]
id = "recoverable"
type = "noul"
instructions = "Is this a recoverable change: creating or editing files inside the project, its scratch directories or the system temp directory, or building, testing, formatting or linting the project? Deleting files, discarding uncommitted work, rewriting or pushing git history, publishing, or changing anything outside those places is not recoverable."
threshold = "constant.RECOVERABLE_MIN"
state_template = "state.md"
[node.inputs]
captain_messages = "conversation.captain_messages"
recent = "conversation.recent"
delegation = "conversation.delegation"
skill = "event.skill"
tool = "event.tool"
args = "event.args"
commands = "event.commands"
inside_project = "event.inside_project"
rule = "event.rule"
[node.next]
yes = ["allow"]
no = ["unrequested_ask"]

[[node]]
id = "danger"
type = "noul"
instructions = "Is this exact call destructive, irreversible, does it publish something, or does it touch credentials?"
threshold = "constant.DANGER_MIN"
state_template = "state.md"
[node.inputs]
captain_messages = "conversation.captain_messages"
recent = "conversation.recent"
delegation = "conversation.delegation"
skill = "event.skill"
tool = "event.tool"
args = "event.args"
commands = "event.commands"
inside_project = "event.inside_project"
rule = "event.rule"
[node.next]
yes = ["requested"]
no = ["allow"]

[[node]]
id = "protected_allow"
type = "action"
action = "allow"
[node.params]
protected_ok = true

[[node]]
id = "allow"
type = "action"
action = "allow"
[node.params]

[[node]]
id = "protected_ask"
type = "action"
action = "ask_captain"
[node.params]
note = "The Captain did not explicitly request or accept this change to WithNav's own configuration."

[[node]]
id = "unrequested_ask"
type = "action"
action = "ask_captain"
[node.params]
note = "This action was not requested, does not only read, and is not a recoverable change."

[[node]]
id = "danger_ask"
type = "action"
action = "ask_captain"
[node.params]
note = "This exact call is destructive, irreversible, publishes something or touches credentials, and was not requested."
