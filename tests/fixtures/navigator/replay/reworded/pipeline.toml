# Candidate pipeline for the replay tests: the built-in shape with one
# question reworded. The answers the log holds are answers to another
# question, so a replay without `--reask` reports these triggers as not
# comparable.
[instinct]
model = "instinct"

[[trigger]]
on = ["save", "idle"]
state = "prompts/state.md"
prefilter = { min_changed_lines = 3, cooldown_ms = 20000 }

[trigger.questions.worth_attention]
type = "noul"
instructions = "Is this change worth a second pair programmer's attention right now?"

[trigger.questions.route]
type = "choice"
instructions = "Who should handle this?"
criteria = { silent = "Nothing worth saying", metacognition = "A short local remark on the code", cognition = "A deeper discussion about design or intent" }

[trigger.questions.drift]
type = "noul"
instructions = "Does the code drift away from the stated intent?"

[[trigger.branch]]
when = "has_intent && drift > 0.8"
action = "wake_cognition"

[[trigger.branch]]
when = "worth_attention > 0.7"
action = "remark"
prompt = "prompts/remark.md"

[[trigger.branch]]
when = "true"
action = "silent"
